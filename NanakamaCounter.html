<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ななかまカウンター</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="CounterStyle.css">
        <!-- Open Graph -->
        <meta property="og:title" content="ななかまカウンター">
        <meta property="og:description" content="ななたまに関するあれこれをカウントアップしていきます。">
        <meta property="og:image" content="https://rgb65bit.github.io/NanaCounter/EnbedImage.png">
        <meta property="og:url" content="https://rgb65bit.github.io/NanaCounter/NanakamaCounter.html">
        <meta property="og:type" content="website">
        <!-- X(Twitter)専用タグ -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="ななたまカウンター">
        <meta name="twitter:description" content="ななたまに関するあれこれをカウントアップしていきます。">
        <meta name="twitter:image" content="https://rgb65bit.github.io/NanaCounter/EnbedImage.png">
    </head>
    <body>
        <!-- ヘッダーを設計 -->
        <div class="header">
            <h1 style="font-family:'Mochiy Pop One'">ななかまカウンター</h1>
            <nav>
                <a href="NanatamaCounter.html">ななたまカウンター</a>
                <a href="NanakamaCounter.html">ななかまカウンター</a>
                <a href="NanairoCounter.html">なないろカウンター</a>
            </nav>
        </div>
        <div style="margin-top: 40px;">
            <p>あなたがななかまになった時からどれくらいたったのかをカウントします。</p>
            <img style="background-color:#FFFFFF; display:block; margin:0 auto; width:35%; height:auto; border-radius:50%; border: 4px solid #FFC547; box-shadow: 0 0 70px rgba(255, 255, 255, 0.3);" src="Nana.png" alt="Nana Tamanoi">
        </div>
        <div>ななかまになった日時：<input id="BeNanakamaDate" type="date" min="2021-02-05" value="2024-09-21" required><input id="BeNanakamaTime" type="time" value="23:15"></div>
        <!-- 主のカウントアッパー -->
        <div class="content">
            <p>珠乃井ナナを推し始めて...</p>
            <div id="NanatamaLiveCounter"></div> 
        </div>
        <!-- 総経過秒数と現在時刻を表示する -->
        <div class="content2">
            <p>総経過秒数は、</p>
            <div id="totalSeconds"></div>
            <p>秒です！</p>
        </div>
        <div class="content3">
            <p>現在時刻：</p>
            <div id="currentTime"></div>
        </div>
        <!-- Please Share! -->
        <a style="text-decoration:none;" id="PostingLink" href="" target="_blank"><button id="ShareToX">Xに共有(ポストの作成画面が開きます！)</button></a>
        <!-- なんか見にくいから仕切り～ -->
        <div id="border" style="border: 1px solid #FFF; width: 95%;"></div>

        <div class="line">
            <p>換算してみる</p>
            <select id="WhatCanWeDoInTheTime">
                <option style="background-color:#777777;" value="None">(対象を選択する)</option>
                <option value="Beats">心拍</option>
                <option value="Syaoran">シャオシャオ蘭々</option>
                <option value="Dokikyun">どきどきキュン！で大暴走♡</option>
                <option value="Muriota">無理すぎ♡オタクハート</option>
                <option value="Kcal">熱量</option>
                <option value="Film">フィルム</option>
                <option value="RawVideo">動画</option>
                <option value="PCMAudio">音声</option>
                <option value="FullMoon">満月</option>
            </select>
        </div>
        <div style="margin-bottom: 24px;" class="Iroiro">これまでをわかりやすい単位に換算します！</div>

        <script>
            let NanaLiveSecond = 0; //グローバル変数にして、他の関数でも使う
            let NanaLiveDays;
            function NanatamaLiveTime(){ //でっかいカウントの処理
                const dateVal = document.getElementById("BeNanakamaDate").value;
                const timeVal = document.getElementById("BeNanakamaTime").value;
                const NanaDebut = Math.floor(new Date(`${dateVal}T${timeVal}:00`).getTime() / 1000);
                const NanaNow = Math.floor(Date.now() / 1000);
                const NanaDifference = NanaNow - NanaDebut;
                const NanaNowSec = NanaDifference % 60; //UNIX時間を60で割ったあまりを求め、秒数を確定
                const NanaNowMinTemp = Math.floor(NanaDifference / 60); //UNIX時間を60で割った商のみを求め、分数を計算しやすくする(小数点以下は秒数となる)
                const NanaNowMin = NanaNowMinTemp % 60; //分数を60で割ったあまりを求め、分数を確定
                const NanaNowHouTemp = Math.floor(NanaNowMinTemp / 60); //分数を60で割った商のみを求め、時間数を計算しやすくする(少数点以下は分数となる)
                const NanaNowHou = NanaNowHouTemp % 24; //時間数を24で割ったあまりを求め、時間数を確定
                const NanaDay = Math.floor(NanaNowHouTemp / 24); //時間数を24で割った商のみを求め、日数を確定
                NanaLiveSecond = NanaDifference; //グローバル変数にして、他の関数でも使う
                NanaLiveDays = NanaDay
                document.getElementById('NanatamaLiveCounter').textContent = `${NanaDay}日と ${NanaNowHou}時間 ${NanaNowMin}分 ${NanaNowSec}秒  経過しました！`; //文字列更新
                document.getElementById('PostingLink').href = `https://x.com/intent/post?text=`  + encodeURIComponent(`#ななかまカウンター\n` + (document.getElementById("BeNanakamaDate").value + " " + document.getElementById("BeNanakamaTime").value +`にななかまになってから、\n${NanaDay}日と${NanaNowHou}時間${NanaNowMin}分${NanaNowSec}秒経過しました！\nhttps://x.gd/NanakamaCounter`)); //Xのリンク更新
            };
            function GetNowTime() { //現在時刻をUNIX→文字列へ、いわば「時計」。
                const now = new Date();
                const currentTimeString = now.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });;
                document.getElementById('currentTime').textContent = currentTimeString;
            };
            function GetTotalSeconds() { //総経過秒数表示
                document.getElementById('totalSeconds').textContent = NanaLiveSecond;
            };
            function SelectedThings() { //プルダウンに応じて表示を変えたり
                const Selected = document.getElementById('WhatCanWeDoInTheTime').value;
                if (Selected === "Beats") {
                    const Beats = Math.floor(NanaLiveSecond / 60 * 70); //経過時間を60で割って分にして70を掛ける
                    document.querySelector('.Iroiro').textContent = `これまでに、ななたまの心臓が、${Beats}回生きた証を残しました。(BPM70計算)`;
                } 
                else if (Selected === "Syaoran") {
                    const ranran = Math.floor(NanaLiveSecond / (3 * 60 + 52)); //1曲3分52秒
                    document.querySelector('.Iroiro').textContent = `これまでに、シャオシャオ蘭々を、${ranran}回分聴けました。`;
                } 
                else if (Selected === "Dokikyun") {
                    const Dokikyun = Math.floor(NanaLiveSecond / (3 * 60 + 12)); //1曲3分12秒
                    document.querySelector('.Iroiro').textContent = `これまでに、どきどきキュン！で大暴走♡した回数は、${Dokikyun}回分になります。`;
                } 
                else if (Selected === "Muriota") {
                    const Muriota = Math.floor(NanaLiveSecond / (3 * 60)); //1曲丁度3分
                    document.querySelector('.Iroiro').textContent = `これまでに、無理すぎ♡オタクハートを${Muriota}回聴けました。(ほかにも、カップ麺が${Muriota}個食える！)`;
                } 
                else if (Selected === "Kcal") {
                    const Kcal = Math.floor(NanaLiveSecond * (2000 / 86400) ); //カロリーって平均出しにくそうだよね
                    document.querySelector('.Iroiro').textContent = `これまでに、ハイパーウルトラ元気な女の子が私達にくれたエネルギーは、${Kcal}kcalです。(1日2000kcal想定)`;
                }
                else if (Selected === "Film") {
                    const FilmMeter = Math.floor(NanaLiveSecond * 0.4572); //24fps35mm標準のフィルムは、1秒で457.2mm巻かれるそう。457.2mm≒0.4572m
                    const FilmKiro = (FilmMeter / 1000); //キロメートルへ
                    const FilmKiroRounded = Math.floor(FilmMeter / 1000); //小数点捨
                    const FilmKiroRounded2 = (FilmMeter / 1000).toFixed(2)
                    const RatePercent = (FilmKiro * 100 / 1150000).toFixed(2); //比率を求めパーセント変換
                    const HowManyDoesItHaveEatrh = ((FilmMeter / 1000) / 40000).toFixed(2) //地球の円周に換算してみる
                    document.querySelector('.Iroiro').textContent = `いままでの記憶のフィルムは、${FilmKiroRounded2}キロメートルになります。地球${HowManyDoesItHaveEatrh}周分です。\n115万キロに占める比率は、1150000:${FilmKiroRounded}で、約${RatePercent}%です。`; //人生を80年としフィルム長は115万キロメートルになる。https://www.youtube.com/watch?v=ReCnlwVZj1M
                }
                else if (Selected === "RawVideo") {
                    const BytePerSeconds = (3840 * 2160 * 60 * 3); //4K@6024bitのB/s
                    const Tera = (BytePerSeconds / 1000000000000); //単位をテラにする
                    const FileSizeTeraRounded = Math.floor(NanaLiveSecond * Tera);
                    document.querySelector('.Iroiro').textContent = `いままでを、4K@60fps非圧縮で記録すると、約${FileSizeTeraRounded}テラバイトになります。`;
                }
                else if (Selected === "PCMAudio") {
                    const BytePerSeconds = (96000 * 3 * 2); //96kHz24bit2chのB/s
                    const Tera = (BytePerSeconds / 1000000000000); //単位をテラにする
                    const FileSizeTeraRoundedDisplay = (Math.floor(Tera * NanaLiveSecond * 100) /100);
                    document.querySelector('.Iroiro').textContent = `いままでを、PCM96kHz/24bitで記録すると、約${FileSizeTeraRoundedDisplay}テラバイトになります。`;
                }
                else if (Selected === "FullMoon"){
                    const MoonRate = 29.5;
                    const FullMoonTImes = Math.floor(NanaLiveDays / MoonRate);
                    document.querySelector('.Iroiro').textContent = `いままで、${FullMoonTImes}回満月が訪れました。`;
                }
                else {
                    document.querySelector('.Iroiro').textContent = `これまでをわかりやすい単位に換算します！`;
                };
            };
            document.getElementById('WhatCanWeDoInTheTime').addEventListener('change',Intervaler);
            document.getElementById('BeNanakamaDate').addEventListener('change',Intervaler);
            document.getElementById('BeNanakamaTime').addEventListener('change',Intervaler);
            function Intervaler() {
                NanatamaLiveTime();
                GetNowTime();
                GetTotalSeconds();
                SelectedThings();
            };
            setInterval(Intervaler, 1000) //1000msごとに実行
            Intervaler(); //実行
        </script>
    </body>
</html>
